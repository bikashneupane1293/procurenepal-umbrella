services:
  postgres:
    image: postgres:18-alpine
    container_name: procurenepal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurenepal
      POSTGRES_PASSWORD: procurenepal_dev_password
      POSTGRES_DB: procurenepal
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: procurenepal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
